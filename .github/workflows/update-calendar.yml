name: Update roster calendar

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update-calendar:
    if: startsWith(github.event.issue.title, 'Roster:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update calendar
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          body = os.environ.get("ISSUE_BODY", "")
          path = Path("roster.ics")

          pattern = re.compile(
              r'(\d{4}-\d{2}-\d{2})\s*\|\s*(\d{2}:\d{2})\s*\|\s*(\d{2}:\d{2})\s*\|\s*(.+)'
          )

          new_events = {}

          for line in body.splitlines():
              match = pattern.fullmatch(line.strip())
              if not match:
                  continue

              date, start, end, summary = match.groups()
              uid = f"{date}-{start.replace(':','')}-{end.replace(':','')}@jesse232010.github.io"

              new_events[uid] = (
                  "BEGIN:VEVENT\n"
                  f"UID:{uid}\n"
                  f"DTSTAMP:{datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')}\n"
                  f"DTSTART;TZID=Pacific/Auckland:{date.replace('-','')}T{start.replace(':','')}00\n"
                  f"DTEND;TZID=Pacific/Auckland:{date.replace('-','')}T{end.replace(':','')}00\n"
                  f"SUMMARY:{summary}\n"
                  "END:VEVENT"
              )

          existing = path.read_text() if path.exists() else ""
          existing_events = {}

          for match in re.finditer(r'BEGIN:VEVENT\n(.*?)\nEND:VEVENT', existing, re.S):
              event = match.group(1)
              uid_match = re.search(r'^UID:(.+)$', event, re.M)

              if uid_match:
                  uid = uid_match.group(1).strip()
                  existing_events[uid] = "BEGIN:VEVENT\n" + event + "\nEND:VEVENT"

          existing_events.update(new_events)

          calendar = (
              "BEGIN:VCALENDAR\n"
              "VERSION:2.0\n"
              "PRODID:-//Jesse232010//Work Roster//EN\n"
              "CALSCALE:GREGORIAN\n"
              "X-WR-CALNAME:Work Roster\n"
              + "\n".join(existing_events.values())
              + "\nEND:VCALENDAR\n"
          )

          path.write_text(calendar)
          PY

      - name: Commit calendar
        run: |
          git config user.name "roster-calendar"
          git config user.email "roster-calendar@users.noreply.github.com"
          git add roster.ics
          git diff --cached --quiet || git commit -m "Update roster calendar"
          git push

      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}"
